```yaml
title: Multiple Failed Logins Followed by Successful Authentication
status: experimental
description: |
  Detects multiple failed authentication attempts against the same user
  from the same source IP, followed by a successful authentication
  within a short time window. This pattern may indicate a successful
  brute-force attack and potential account compromise.

author: SOC Investigation
date: 2026/10/06

logsource:
  product: authentication
  service: login

detection:
  failed_login:
    event.category: authentication
    event.outcome: failure

  successful_login:
    event.category: authentication
    event.outcome: success

  timeframe: 10m

  threshold:
    count: 5
    group_by:
      - source.ip
      - user.name

  condition: |
    5 or more failed authentication attempts
    followed by a successful authentication
    from the same source IP for the same user
    within 10 minutes

severity: high
risk_score: 80

mitre_attack:
  - T1110
  - T1110.001
  - T1078

false_positives:
  - User repeatedly entering an incorrect password
  - Expired or recently changed credentials
  - Saved credentials using an outdated password
  - VPN or network changes
  - Automated application authentication failures
  - Legitimate login from a new location or device

investigation:
  - Identify the affected username and source IP.
  - Review whether other accounts were targeted from the same source.
  - Validate the successful login location and device.
  - Check MFA activity where applicable.
  - Review activity immediately after the successful authentication.
  - Correlate authentication, endpoint, WAF and cloud telemetry.

response:
  - Validate the successful login with the affected user.
  - Lock or disable the account if compromise is suspected.
  - Reset the password and validate MFA.
  - Revoke suspicious sessions, tokens or API keys.
  - Block the source IP where appropriate.
  - Investigate the endpoint if credential theft is suspected.
```
