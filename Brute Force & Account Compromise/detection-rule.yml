```yaml
title: Brute Force Followed by Successful Authentication
id: *****
status: experimental
description: |
  Detects multiple failed authentication attempts against the same user
  from the same source IP followed by a successful authentication within
  a short time window. This pattern may indicate a successful brute-force
  attack and potential account compromise.

author: SOC Investigation Lab
date: 2026/10/06

correlation:
  type: temporal
  rules:
    - Brute Force Authentication Failures
    - Successful Authentication
  group-by:
    - source.ip
    - user.name
  timespan: 10m

condition:
  type: event_count
  rule: Brute Force Authentication Failures
  count: 5
  condition: ">="

level: high

tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
  - attack.t1078

---
title: Brute Force Authentication Failures
id: 91f3d6c2-4a87-4c3f-b8a1-52e7d9f40123
status: experimental
description: Detects failed authentication attempts.
author: SOC Investigation Lab

logsource:
  category: authentication

detection:
  selection:
    event.category: authentication
    event.outcome: failure
  condition: selection

level: medium

---
title: Successful Authentication
id: 5e82b1a7-6d34-4f91-a8c2-73d5e9b40126
status: experimental
description: Detects successful authentication events.
author: SOC Investigation

logsource:
  category: authentication

detection:
  selection:
    event.category: authentication
    event.outcome: success
  condition: selection

level: low
